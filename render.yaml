services:
  - type: web
    name: greenweave
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm run build
    startCommand: npm run start -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_VERIFY_EMAIL
        value: greenweave8@gmail.com
      - key: RESEND_SENDER_EMAIL
        sync: false
      - key: USER_SESSION_SECRET
        generateValue: true
      # GitHub PAT (scope: repo) enables admin edits on Render to push directly.
      - key: GIT_PUSH_TOKEN
        sync: false
    disk:
      name: greenweave-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1